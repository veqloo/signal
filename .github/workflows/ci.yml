name: Signal CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate legacy frontend module and configuration
        run: node scripts/check.mjs
      - name: Build Next.js application & check types
        run: npm run build
