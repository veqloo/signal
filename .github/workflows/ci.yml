name: Signal CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Audit dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name + ': ' + v.severity + ' | direct=' + v.isDirect + ' | fix=' + JSON.stringify(v.fixAvailable));"
      - name: Validate legacy frontend module and configuration
        run: node scripts/check.mjs
      - name: Build Next.js application & check types
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c2lnbmFsLmNsZXJrLmFjY291bnRzLmRldiQ
          NEXT_PUBLIC_APP_URL: https://signal.veqlo.me
        run: npm run build
